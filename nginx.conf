server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS and CSS: no-store tells Cloudflare not to cache at the edge
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-store";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Binary data: cache for a day (only changes on a data rebuild)
    location ~* \.bin$ {
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # HTML: no-store
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        expires 0;
    }
}
