server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS and CSS: always revalidate (no stale cached code)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Binary data: cache for a day (only changes on a data rebuild)
    location ~* \.bin$ {
        add_header Cache-Control "public, max-age=86400";
        expires 1d;
    }

    # HTML: never cache
    location ~* \.html$ {
        add_header Cache-Control "no-store";
        expires 0;
    }
}
