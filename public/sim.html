<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sidewalk Zero — Simulator</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
      color: #e8e8e8;
      font-family: 'Courier New', Courier, monospace;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    #map {
      flex: 1;
      min-width: 0;
    }

    #panel {
      width: 300px;
      min-width: 300px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: #0d0d0d;
      border-left: 1px solid #1e1e1e;
    }

    #score-box {
      padding: 1.5rem 1rem;
      text-align: center;
      transition: background-color 0.3s ease;
      border-bottom: 1px solid #1e1e1e;
    }

    #score-num {
      font-size: 4rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    #score-label {
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      opacity: 0.45;
      margin-top: 0.3rem;
      text-transform: uppercase;
    }

    .section {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid #1e1e1e;
    }

    .section-title {
      font-size: 0.52rem;
      letter-spacing: 0.22em;
      opacity: 0.35;
      text-transform: uppercase;
      margin-bottom: 0.7rem;
    }

    .param-row {
      margin-bottom: 0.7rem;
    }

    .param-row:last-child {
      margin-bottom: 0;
    }

    .param-row label {
      display: flex;
      justify-content: space-between;
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      opacity: 0.6;
      margin-bottom: 0.25rem;
      text-transform: uppercase;
    }

    .param-row label span {
      opacity: 1;
      color: #e8e8e8;
    }

    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(232, 232, 232, 0.2);
      outline: none;
      cursor: pointer;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(232, 232, 232, 0.7);
      cursor: pointer;
    }

    input[type=range]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      background: rgba(232, 232, 232, 0.7);
      cursor: pointer;
    }

    #row-heading.disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    .omni-label {
      font-size: 0.58rem;
      letter-spacing: 0.1em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      opacity: 0.6;
      text-transform: uppercase;
    }

    #pos-lat, #pos-lon {
      font-size: 0.58rem;
      letter-spacing: 0.08em;
      opacity: 0.55;
      margin-bottom: 0.2rem;
    }

    #in-radius {
      font-size: 0.52rem;
      letter-spacing: 0.1em;
      opacity: 0.35;
      margin-top: 0.4rem;
    }

    #status-msg {
      font-size: 0.52rem;
      letter-spacing: 0.1em;
      opacity: 0.35;
      padding: 0.75rem 1rem;
      margin-top: auto;
      border-top: 1px solid #1e1e1e;
    }

    @media (max-width: 700px) {
      #app { flex-direction: column; }
      #map { flex: 1; min-height: 0; }
      #panel {
        width: 100%;
        min-width: 0;
        height: 300px;
        min-height: 300px;
        border-left: none;
        border-top: 1px solid #1e1e1e;
        flex-direction: row;
        flex-wrap: wrap;
        overflow-y: auto;
      }
      #score-box { width: 120px; border-bottom: none; border-right: 1px solid #1e1e1e; }
      .section { flex: 1; min-width: 180px; border-bottom: none; border-right: 1px solid #1e1e1e; }
      #status-msg { width: 100%; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div id="panel">

      <div id="score-box">
        <div id="score-num">—</div>
        <div id="score-label">Danger Score</div>
      </div>

      <div class="section">
        <div id="pos-lat">LAT  —</div>
        <div id="pos-lon">LON  —</div>
        <div id="in-radius">— incidents in radius</div>
      </div>

      <div class="section">
        <div class="section-title">Formula Params</div>

        <div class="param-row">
          <label>Reference Dist <span id="val-ref">15m</span></label>
          <input id="sl-ref" type="range" min="1" max="200" step="1" value="15">
        </div>

        <div class="param-row">
          <label>Radius <span id="val-radius">500m</span></label>
          <input id="sl-radius" type="range" min="50" max="5000" step="50" value="500">
        </div>

        <div class="param-row">
          <label>Display Scale <span id="val-scale">400</span></label>
          <input id="sl-scale" type="range" min="50" max="2000" step="10" value="400">
        </div>

        <div class="param-row">
          <label>Yellow Threshold <span id="val-yellow">40</span></label>
          <input id="sl-yellow" type="range" min="1" max="500" step="1" value="40">
        </div>

        <div class="param-row">
          <label>Red Threshold <span id="val-red">150</span></label>
          <input id="sl-red" type="range" min="1" max="999" step="1" value="150">
        </div>
      </div>

      <div class="section">
        <div class="section-title">Heading</div>

        <div class="param-row" id="row-heading">
          <label>Direction <span id="val-heading">0°</span></label>
          <input id="sl-heading" type="range" min="0" max="359" step="1" value="0">
        </div>

        <label class="omni-label">
          <input type="checkbox" id="omni-cb" checked> Omni Mode
        </label>
      </div>

      <div id="status-msg">loading incidents...</div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="sim.js"></script>
</body>
</html>
