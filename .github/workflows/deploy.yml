# Pulls the latest code on the home server, rebuilds the Docker container,
# and purges the Cloudflare edge cache whenever main is updated.
#
# One-time setup:
#   1. DEPLOY_PATH repo variable (already set):
#      /home/eddie/repos/sidewalk-zero
#   2. CF_ZONE_ID repo secret — find in Cloudflare dashboard → eddielathamjones.com → Overview → right sidebar
#   3. CF_API_TOKEN repo secret — Cloudflare dashboard → My Profile → API Tokens
#      → Create Token → use "Cache Purge" template, scope to eddielathamjones.com zone

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Pull, rebuild, purge cache
    runs-on: self-hosted

    steps:
      - name: Pull latest changes
        run: git -C ${{ vars.DEPLOY_PATH }} pull origin main

      - name: Rebuild and restart container
        run: docker compose -f /home/eddie/docker/gis/docker-compose.yml up -d --build sidewalk-zero

      - name: Purge Cloudflare edge cache
        if: ${{ secrets.CF_API_TOKEN != '' }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -o '"success":[a-z]*'

      - name: Confirm
        run: |
          echo "Deployed at $(date)"
          echo "HEAD: $(git -C ${{ vars.DEPLOY_PATH }} rev-parse --short HEAD)"
